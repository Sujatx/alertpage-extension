<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AlertPage Assist</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <h1>AlertPage Assist</h1>
    <span id="status" class="status" role="status" aria-live="polite"></span>
    <button type="button" id="themeToggle" class="icon-btn" title="Toggle dark mode" aria-label="Toggle dark mode" aria-pressed="false"></button>
  </header>

  <section class="group" aria-labelledby="g-screen">
    <h2 id="g-screen">Working Screen</h2>
    <label class="row">
      <span>Highlight keywords</span>
      <span class="switch"><input type="checkbox" id="highlightEnabled"><span class="slider"></span></span>
    </label>
    <label class="row">
      <span>Reshuffle footer buttons</span>
      <span class="switch"><input type="checkbox" id="footerReshuffleEnabled"><span class="slider"></span></span>
    </label>
    <label class="row">
      <span>Monitor sends instantly</span>
      <span class="switch"><input type="checkbox" id="monitorAutoSendEnabled"><span class="slider"></span></span>
    </label>
  </section>

  <section class="group" aria-labelledby="g-feed">
    <h2 id="g-feed">Data Feed link carries</h2>
    <label class="row">
      <span>System</span>
      <span class="switch"><input type="checkbox" id="syncSource"><span class="slider"></span></span>
    </label>
    <label class="row">
      <span>County</span>
      <span class="switch"><input type="checkbox" id="syncCounty"><span class="slider"></span></span>
    </label>
    <label class="row">
      <span>Talk group</span>
      <span class="switch"><input type="checkbox" id="syncTalkgroup"><span class="slider"></span></span>
    </label>
    <div class="row">
      <label for="syncTimeRange" class="grow">Time window</label>
      <span class="minutes" id="minutesWrap">
        <span aria-hidden="true">±</span>
        <input type="number" id="timeWindowMinutes" min="1" max="720" step="1" inputmode="numeric" aria-label="Minutes each way">
        <span aria-hidden="true">min</span>
      </span>
      <label class="switch"><input type="checkbox" id="syncTimeRange"><span class="slider"></span></label>
    </div>
  </section>

  <section class="group" aria-labelledby="g-collector">
    <h2 id="g-collector">Collector</h2>
    <label class="row">
      <span>Record usage data</span>
      <span class="switch"><input type="checkbox" id="collectorEnabled"><span class="slider"></span></span>
    </label>
    <p class="hint" id="collectorStatus"></p>
    <p class="hint" id="collectorHint" hidden>Set your userID note pill to your company ID to start uploading.</p>
  </section>

  <details class="group fold">
    <summary><span class="grow">Keywords</span><span class="count" id="keywordCount"></span></summary>
    <div class="chips" id="keywords">
      <input type="text" id="keywordInput" placeholder="Add keyword" aria-label="Add keyword" enterkeyhint="done">
    </div>
    <p class="hint">Whole words, any case. Press Enter to add.</p>
  </details>

  <details class="group fold">
    <summary><span class="grow">Note pills</span><span class="count" id="pillCount"></span></summary>
    <div id="pills"></div>
    <button type="button" id="addPill" class="text-btn">+ Add pill</button>
    <p class="hint">Shown beside Internal Notes. A click replaces the field.</p>
  </details>

  <footer class="foot">
    <button type="button" id="reset" class="text-btn">Restore defaults</button>
    <span class="made-by">Made by <a href="https://github.com/Sujatx" target="_blank" rel="noopener noreferrer">Sujat</a></span>
  </footer>

  <script src="../config/keywords.js"></script>
  <script src="../config/pills.js"></script>
  <script src="../config/data-feed-settings.js"></script>
  <script src="../lib/highlight.js"></script>
  <script src="../lib/notes.js"></script>
  <script src="../config/collector-settings.js"></script>
  <script src="../lib/collect-envelope.js"></script>
  <script src="popup.js"></script>
</body>
</html>
